name: Benchmarks

on:
  workflow_dispatch:
  push:
    branches: [ develop ]
    paths:
      - 'src/**'
      - 'pom.xml'

jobs:
  benchmark:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    
    - name: Compile benchmarks
      run: ./mvnw test-compile -q
    
    - name: Run Core Operations Benchmark
      run: |
        echo "=== Running Core Operations Benchmark ==="
        ./mvnw exec:java -Dexec.mainClass="org.openjdk.jmh.Main" \
          -Dexec.classpathScope=test \
          -Djmh.includes="CoreOperationsBenchmark" \
          -Djmh.warmupIterations=2 \
          -Djmh.measurementIterations=3 \
          -q
    
    - name: Run Compression Benchmark
      run: |
        echo "=== Running Compression Benchmark ==="
        ./mvnw exec:java -Dexec.mainClass="org.openjdk.jmh.Main" \
          -Dexec.classpathScope=test \
          -Djmh.includes="CompressionBenchmark" \
          -Djmh.warmupIterations=2 \
          -Djmh.measurementIterations=3 \
          -q
    
    - name: Run Embedded Database Benchmark
      run: |
        echo "=== Running Embedded Database Benchmark ==="
        ./mvnw exec:java -Dexec.mainClass="org.openjdk.jmh.Main" \
          -Dexec.classpathScope=test \
          -Djmh.includes="EmbeddedDatabaseBenchmark" \
          -Djmh.warmupIterations=2 \
          -Djmh.measurementIterations=3 \
          -q
    
    - name: Upload benchmark results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: benchmark-results
        path: |
          jmh-result.json
          jmh-result.txt
        retention-days: 30
